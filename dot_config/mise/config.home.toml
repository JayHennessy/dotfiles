# Home-only tools. Merged on top of config.toml when MISE_ENV=home.
# Move any home-specific tools here from config.toml (the shared list).
[tools]
opencode = "latest"
# rtk (Rust Token Killer) binary - required by the 'openrtk' opencode plugin.
# Registry maps `rtk` -> aqua:rtk-ai/rtk (the token killer, NOT the crates.io "Rust Type Kit").
rtk = "latest"
# hermes-agent (nousresearch/hermes-agent) - not in the mise registry; installed
# from PyPI via the pipx backend. Provides the `hermes`/`hermes-acp`/`hermes-agent`
# CLIs. Needs Python >=3.11,<3.14, so uv picks 3.13 (mise's python=latest is 3.14).
"pipx:hermes-agent" = "latest"
# ffmpeg - runtime dep for hermes-agent's voice/media features.
ffmpeg = "latest"
